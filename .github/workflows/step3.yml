name: Step 3 - Twitter Accounts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step3-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: ${{ vars.VK_CROSSPOST_MODE == 'browser' || vars.VK_CROSSPOST_MODE == 'web' }}
        run: python -m playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Восстанавливаем состояние из кэша предыдущего run.
      # restore-keys без run_id гарантирует что найдётся любой предыдущий кэш.
      - name: Restore state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            published_ids.json
            source_news_cache.json
            ig_user_id_cache.json
          key: step3-state-${{ github.run_id }}
          restore-keys: |
            step3-state-
            step1-state-
            step2-state-
            step4-state-

      - name: Show state
        run: |
          if [ -f published_ids.json ]; then
            echo "✅ published_ids.json восстановлен: $(wc -l < published_ids.json) строк"
          else
            echo "⚠️  published_ids.json не найден (первый запуск)"
          fi

      - name: Run bot
        env:
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID:         ${{ secrets.CHANNEL_ID }}
          DEEPL_KEY:          ${{ secrets.DEEPL_KEY }}
          OPENROUTER_KEY:     ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_MODEL:   ${{ secrets.OPENROUTER_MODEL }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          FORMAT_RAG_ENABLED: "1"
          STEP3_ACCOUNTS:     ${{ secrets.STEP3_ACCOUNTS }}
          SCWEET_AUTH_TOKEN:  ${{ secrets.SCWEET_AUTH_TOKEN }}
          SCWEET_PROXY:       ${{ secrets.SCWEET_PROXY }}
          STEP3_LIMIT:        ${{ vars.STEP3_LIMIT || '20' }}
          ALERT_CHANNEL_ID:   ${{ secrets.ALERT_CHANNEL_ID }}
          BOT_NAME:           ${{ vars.BOT_NAME || 'NicoPazBot' }}
          SIGNATURE_HASHTAG:  ${{ secrets.SIGNATURE_HASHTAG }}
          SIGNATURE_URL:      ${{ secrets.SIGNATURE_URL }}
          SIGNATURE_URL_TEXT: ${{ secrets.SIGNATURE_URL_TEXT }}
          VK_ACCESS_TOKEN:    ${{ secrets.VK_ACCESS_TOKEN }}
          VK_OWNER_ID:        ${{ secrets.VK_OWNER_ID }}
          VK_API_VERSION:     ${{ secrets.VK_API_VERSION }}
          VK_FROM_GROUP:      ${{ secrets.VK_FROM_GROUP }}
          VK_CROSSPOST_DELAY_MINUTES:  ${{ vars.VK_CROSSPOST_DELAY_MINUTES || '1' }}
          VK_CROSSPOST_MODE:  ${{ vars.VK_CROSSPOST_MODE || 'api' }}
          VK_WEB_TARGET_URL:  ${{ secrets.VK_WEB_TARGET_URL || vars.VK_WEB_TARGET_URL }}
          VK_WEB_STORAGE_STATE_B64:  ${{ secrets.VK_WEB_STORAGE_STATE_B64 }}
          VK_WEB_STORAGE_STATE_JSON: ${{ secrets.VK_WEB_STORAGE_STATE_JSON }}
          VK_WEB_COOKIES_B64:  ${{ secrets.VK_WEB_COOKIES_B64 }}
          VK_WEB_COOKIES_JSON: ${{ secrets.VK_WEB_COOKIES_JSON }}
          VK_WEB_HEADLESS:    ${{ vars.VK_WEB_HEADLESS || '1' }}
          VK_WEB_TIMEOUT_SECONDS: ${{ vars.VK_WEB_TIMEOUT_SECONDS || '90' }}
          YANDEX_API_KEY:    ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID:  ${{ secrets.YANDEX_FOLDER_ID }}
          USAGE_LOG_URL:   ${{ secrets.USAGE_LOG_URL }}
          USAGE_LOG_TOKEN: ${{ secrets.USAGE_LOG_TOKEN }}
        run: python bot.py --step 3

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            published_ids.json
            source_news_cache.json
            ig_user_id_cache.json
          key: step3-state-${{ github.run_id }}
